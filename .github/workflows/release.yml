name: Build & Release 2048 App

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag for the GitHub Release (e.g., v2.3.0)"
        required: false
        default: "v2.3.0"

permissions:
  contents: write

concurrency:
  group: "app-release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  package-app:
    name: Package Web & Standalone App
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine Version Tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            LATEST_V23=$(git tag -l "v2.3.*" --sort=-v:refname | head -n 1)
            if [[ -z "$LATEST_V23" ]]; then
              VERSION="v2.3.0"
            else
              PATCH="${LATEST_V23##*.}"
              VERSION="v2.3.$((PATCH + 1))"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies, Verify & Build Standalone App
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run verify
          npm run build

          mkdir -p dist
          cp -r index.html style.css wallpaper.js script.js package.json server.js scripts README.md dist/

          cd dist
          zip -r "../release-assets/2048-app-${{ steps.meta.outputs.version }}.zip" .
          tar -czf "../release-assets/2048-app-${{ steps.meta.outputs.version }}.tar.gz" .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2048-app-bundle-${{ steps.meta.outputs.version }}
          path: release-assets/*

  create-github-release:
    name: Publish GitHub App Release
    needs: package-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Packaged Release Assets
        uses: actions/download-artifact@v4
        with:
          name: 2048-app-bundle-${{ needs.package-app.outputs.version }}
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package-app.outputs.version }}
          name: "2048 — Curated Studio Edition (${{ needs.package-app.outputs.version }})"
          make_latest: true
          generate_release_notes: true
          body: |
            ## ✨ 2048 — Curated Studio Edition (`${{ needs.package-app.outputs.version }}`)

            ### 🌟 What's New in `v2.3.0` — 24K Gold Classic Dark Mode & First-Run Translucent Welcome Showcase
            - **Obsidian & 24K Imperial Gold Dark Mode for Classic Warm:** Redesigned *Classic Warm — Dark Mode* (both board/tiles and the live *Warm Spiral Doodles* wallpaper) into a warm gilded **Obsidian, Antique Bronze & 24K Imperial Gold** palette so it feels authentically connected to Classic 2048 and completely distinct from *Ocean Blue*.
            - **First-Run Translucent Welcome Showcase (`▶ Let's Start`):** New players are greeted by a frosted-glass welcome card suspended over the live animated game board and 60 FPS wallpaper, featuring a floating `2·0·4·8` crest, live starter-vibe & Dark/Light preview controls, and a shimmering **`▶ Let's Start`** button (`Enter` / `Space` supported).
            - **Permanent Forever-Once Persistence:** Stores completion in **both** a long-lived browser cookie (`Expires=2099`) and `localStorage`, ensuring the welcome screen never interrupts returning players again unless browser cookies or cache/site-data are cleared (with an optional *View Welcome Showcase Screen* button in `📖 Guide`).

            ### 🚀 Core Studio Highlights
            - **10 Themes × Connected 60 FPS Live Wallpapers (20 Palettes):** Two-way Theme ↔ Wallpaper sync (*Forest Emerald* ↔ *🌿 Green Doodle Grove*, *Classic Warm* ↔ *🌀 Warm Spiral Doodles*, *Sakura Blossom* ↔ *🌸 Sakura Petal Drift*, etc.) plus **Mix & Match Mode** inside the AngularJS Wallpaper Studio.
            - **Curated Minimalist Stage & 5 Side Tabs:** *🏆 Achievements (14)*, *🖼️ Wallpaper*, *⚙️ Settings*, *📊 Analytics & Vault*, and *📖 Strategy Guide*.
            - **Node.js Server & Offline Standalone Build:** Strict release-only CI pipeline (zero deployment jobs).

            ### 📦 Download Options
            - **`2048-standalone.html`** — Single-file offline app with CSS, AngularJS, Live Wallpaper Engine, and 2048 Engine embedded.
            - **`2048-app-${{ needs.package-app.outputs.version }}.zip` / `.tar.gz`** — Complete web & Node.js project archive.
          files: |
            release-assets/2048-app-${{ needs.package-app.outputs.version }}.zip
            release-assets/2048-app-${{ needs.package-app.outputs.version }}.tar.gz
            release-assets/2048-standalone.html
