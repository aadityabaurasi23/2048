name: Build & Release 2048 App

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag for the GitHub Release (e.g., v2.1.0)"
        required: false
        default: "v2.1.0"

permissions:
  contents: write

concurrency:
  group: "app-release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  package-app:
    name: Package Web & Standalone App
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            LATEST_V21=$(git tag -l "v2.1.*" --sort=-v:refname | head -n 1)
            if [[ -z "$LATEST_V21" ]]; then
              VERSION="v2.1.0"
            else
              PATCH="${LATEST_V21##*.}"
              VERSION="v2.1.$((PATCH + 1))"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Assemble Distribution & Single-File Standalone App
        shell: bash
        run: |
          mkdir -p dist release-assets

          # Copy clean web app files for archive bundles
          cp index.html style.css script.js README.md dist/

          # Build a self-contained single-file HTML app (2048-standalone.html)
          python3 - << 'EOF'
          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()
          with open("style.css", "r", encoding="utf-8") as f:
              css = f.read()
          with open("script.js", "r", encoding="utf-8") as f:
              js = f.read()

          html = html.replace('<link rel="stylesheet" href="style.css" />', f"<style>\n{css}\n</style>")
          html = html.replace('<script src="script.js"></script>', f"<script>\n{js}\n</script>")

          with open("release-assets/2048-standalone.html", "w", encoding="utf-8") as f:
              f.write(html)
          EOF

          # Create downloadable zip and tar.gz archives
          cd dist
          zip -r "../release-assets/2048-app-${{ steps.meta.outputs.version }}.zip" .
          tar -czf "../release-assets/2048-app-${{ steps.meta.outputs.version }}.tar.gz" .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2048-app-bundle-${{ steps.meta.outputs.version }}
          path: release-assets/*

  create-github-release:
    name: Publish GitHub App Release
    needs: package-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Packaged Release Assets
        uses: actions/download-artifact@v4
        with:
          name: 2048-app-bundle-${{ needs.package-app.outputs.version }}
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package-app.outputs.version }}
          name: "2048 — Curated Studio Edition (${{ needs.package-app.outputs.version }})"
          make_latest: true
          generate_release_notes: true
          body: |
            ## ✨ 2048 — Curated Studio Edition (`${{ needs.package-app.outputs.version }}`)

            ### 🎨 What's New in `v2.1.0` — Minimalist Front Stage & Side-Tab Drawer
            - **Uncluttered Centered Stage:** Refined the front screen to showcase only the essentials — Hero Score Header, sleek Command Dock with integrated milestone progress bar, `464px × 464px` 2048 board, and slim live Telemetry Footer.
            - **Docked Side Tabs & Slide-Out Glass Drawer:** Moved secondary tools off the main stage into right-edge side tabs (**🏆 Achievements**, **🎨 Studio**, **📊 Analytics**, **📖 Guide**) that glide open smoothly without interrupting active gameplay.
            - **Upgraded Achievements Tab:** Added live `0/12` tab counter, new-badge notification dot, completion progress bar, and `All` / `Unlocked` / `Locked` filter chips.
            - **Release-Only Pipeline (No Deployment):** Cleanly builds and publishes downloadable release bundles without any GitHub Pages deployment job.

            ### 🚀 Core Studio Features
            - **10 Themes × Light & Dark Modes (20 Palettes):** *Classic Warm*, *Ocean Blue*, *Cyberpunk Neon*, *Forest Emerald*, *Crimson Sunset*, *Royal Amethyst*, *Sakura Blossom*, *Nordic Frost*, *Mocha Espresso*, and *Minimalist Ink*.
            - **4 Playable Game Modes:** *Classic Endless*, *⏱️ 2-Min Time Blitz*, *🧘 Zen Relax*, and *🔥 Hardcore Purist*.
            - **Tactical Power-Ups & AI:** *🔀 Shuffle*, *⚡ Zap Low*, milestone bonus charges, *🔥 Merge Streak*, *💡 Smart Hint*, and *🤖 Auto-Play AI*.
            - **Visual Studio & Analytics:** 4 Tile Skins (*Numbers*, *Powers 2ⁿ*, *Roman*, *Cosmic*), 4 SVG Backdrops (*Spirals & Doodles*, *Constellations*, *Topo Waves*, *Clean Gradient*), 3 Tile Shapes, Run Tile Vault, Lifetime Forge Matrix, Match History, and JSON Export/Import.

            ### 📦 Download Options
            - **`2048-standalone.html`** — Single-file offline app (open directly in any browser, no extraction required).
            - **`2048-app-${{ needs.package-app.outputs.version }}.zip` / `.tar.gz`** — Full source & web distribution archive.
          files: |
            release-assets/2048-app-${{ needs.package-app.outputs.version }}.zip
            release-assets/2048-app-${{ needs.package-app.outputs.version }}.tar.gz
            release-assets/2048-standalone.html
