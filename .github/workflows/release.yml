name: Build, Deploy & Release 2048 App

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag for the GitHub Release (e.g., v2.0.1)"
        required: false
        default: "v2.0.1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  package-app:
    name: Package Web & Standalone App
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            LATEST_V2=$(git tag -l "v2.0.*" --sort=-v:refname | head -n 1)
            if [[ -z "$LATEST_V2" ]]; then
              VERSION="v2.0.1"
            else
              PATCH="${LATEST_V2##*.}"
              VERSION="v2.0.$((PATCH + 1))"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Assemble Distribution & Single-File Standalone App
        shell: bash
        run: |
          mkdir -p dist release-assets

          # Copy clean web app files for GitHub Pages and archive bundles
          cp index.html style.css script.js README.md dist/

          # Build a self-contained single-file HTML app (2048-standalone.html)
          python3 - << 'EOF'
          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()
          with open("style.css", "r", encoding="utf-8") as f:
              css = f.read()
          with open("script.js", "r", encoding="utf-8") as f:
              js = f.read()

          html = html.replace('<link rel="stylesheet" href="style.css" />', f"<style>\n{css}\n</style>")
          html = html.replace('<script src="script.js"></script>', f"<script>\n{js}\n</script>")

          with open("release-assets/2048-standalone.html", "w", encoding="utf-8") as f:
              f.write(html)
          EOF

          # Create downloadable zip and tar.gz archives
          cd dist
          zip -r "../release-assets/2048-app-${{ steps.meta.outputs.version }}.zip" .
          tar -czf "../release-assets/2048-app-${{ steps.meta.outputs.version }}.tar.gz" .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2048-app-bundle-${{ steps.meta.outputs.version }}
          path: release-assets/*

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  create-github-release:
    name: Publish GitHub App Release
    needs: package-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Packaged Release Assets
        uses: actions/download-artifact@v4
        with:
          name: 2048-app-bundle-${{ needs.package-app.outputs.version }}
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package-app.outputs.version }}
          name: "2048 — Curated Studio Edition (${{ needs.package-app.outputs.version }})"
          generate_release_notes: true
          body: |
            ## ✨ 2048 — Curated Studio Edition (`${{ needs.package-app.outputs.version }}`)

            ### 🚀 Highlights in v2.0
            - **Symmetrical 3-Column Bento Workspace:** Centered game board flanked by Live Telemetry, Power-Ups, Customization Studio, and Run Tile Progression Vault.
            - **10 Themes × Light & Dark Modes (20 Palettes):** Added *Sakura Blossom*, *Nordic Frost*, *Mocha Espresso*, and *Minimalist Ink* alongside *Classic Warm*, *Ocean Blue*, *Cyberpunk Neon*, *Forest Emerald*, *Crimson Sunset*, and *Royal Amethyst*.
            - **4 Playable Game Modes:** *Classic Endless*, *⏱️ 2-Min Time Blitz*, *🧘 Zen Relax*, and *🔥 Hardcore Purist*.
            - **Tactical Power-Ups & Streaks:** *🔀 Shuffle*, *⚡ Zap Low*, milestone bonus charges, and live *🔥 Merge Streak* tracking.
            - **Deep Visual Studio:** 4 Tile Skins (*Numbers*, *Powers 2ⁿ*, *Roman Ranks*, *Cosmic Icons*), 4 SVG Backdrops (*Spirals & Doodles*, *Star Constellations*, *Zen Topo Waves*, *Clean Gradient*), 3 Tile Shapes, 3 Motion Speeds, and celebration particles.
            - **Player Hub:** Lifetime Analytics, Tile Forge Matrix, 10-Run Match History, 12 Unlockable Achievements, Grandmaster Strategy Guide, and JSON Save Export/Import.

            ### 📦 Download Options
            - **`2048-standalone.html`** — Single-file offline app (open directly in any browser, no extraction required).
            - **`2048-app-${{ needs.package-app.outputs.version }}.zip` / `.tar.gz`** — Full source & web distribution archive.
          files: |
            release-assets/2048-app-${{ needs.package-app.outputs.version }}.zip
            release-assets/2048-app-${{ needs.package-app.outputs.version }}.tar.gz
            release-assets/2048-standalone.html

  deploy-pages:
    name: Live App Deployment (GitHub Pages)
    needs: package-app
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          enablement: true
