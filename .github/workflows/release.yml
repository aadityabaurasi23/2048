name: Build & Release 2048 App

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag for the GitHub Release (e.g., v2.4.0)"
        required: false
        default: "v2.4.0"

permissions:
  contents: write

concurrency:
  group: "app-release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  package-app:
    name: Package Web & Standalone App
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine Version Tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            LATEST_V24=$(git tag -l "v2.4.*" --sort=-v:refname | head -n 1)
            if [[ -z "$LATEST_V24" ]]; then
              VERSION="v2.4.0"
            else
              PATCH="${LATEST_V24##*.}"
              VERSION="v2.4.$((PATCH + 1))"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies, Verify & Build Standalone App
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run verify
          npm run build

          mkdir -p dist
          cp -r index.html style.css wallpaper.js script.js package.json server.js scripts README.md dist/

          cd dist
          zip -r "../release-assets/2048-app-${{ steps.meta.outputs.version }}.zip" .
          tar -czf "../release-assets/2048-app-${{ steps.meta.outputs.version }}.tar.gz" .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2048-app-bundle-${{ steps.meta.outputs.version }}
          path: release-assets/*

  create-github-release:
    name: Publish GitHub App Release
    needs: package-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Packaged Release Assets
        uses: actions/download-artifact@v4
        with:
          name: 2048-app-bundle-${{ needs.package-app.outputs.version }}
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package-app.outputs.version }}
          name: "2048 — Curated Studio Edition (${{ needs.package-app.outputs.version }})"
          make_latest: true
          generate_release_notes: true
          body: |
            ## ✨ 2048 — Curated Studio Edition (`${{ needs.package-app.outputs.version }}`)

            ### 🌟 What's New in `v2.4.0` — Daily Seeded Challenge, Upgrade Power-Up, Scorecard PNG Generator & Bug Fixes
            - **📅 Daily Seeded Challenge Mode (`daily`):** Added a 5th game mode powered by a deterministic Mulberry32 PRNG seeded with the current date (`YYYY-MM-DD`). Every player on the same day gets the exact same starting board and tile spawn sequence!
            - **🔨 Tile Upgrade Power-Up (`#upgrade-btn` / `E`):** Added a 3rd tactical power-up that doubles the rank of a lowest-value tile on the board (`2 → 4`, `4 → 8`, etc.) with celebration particles, Live Wallpaper shockwaves, and bonus charges on `512`/`1024`/`2048`/`4096` milestones.
            - **📸 One-Click Scorecard PNG Poster & Clipboard Summary:** Export a high-DPI (`1280×1640`) themed PNG scorecard displaying your score, best score, max tile, moves/time, and a rendered snapshot of your 2048 board directly from the Game Over/Win overlay or the `📊 Analytics` drawer.
            - **🏆 Expanded to 16 Achievements:** Added **📅 Daily Challenger** (*Score 2,500+ in Daily Challenge mode*) and **🔨 Tile Alchemist** (*Use the Upgrade power-up to evolve a tile*).
            - **🛠️ Quality & Bug Fixes:**
              - **JSON Backup Wallpaper Restore Fix:** Importing a backup JSON now restores your saved Live Wallpaper state, speed, density, ripple settings, and `wallpapersTried` history via `LiveWallpaperEngine.restoreState()`.
              - **Smart Anti-Deadlock Shuffle & History Fix:** `🔀 Shuffle` now searches up to 12 board permutations to find a playable arrangement with valid moves; if no valid moves exist on the board, it properly logs the finished run to Match History.
              - **True Lock-Free Zen Mode:** When all cells fill up with no adjacent matches in `🧘 Zen Mode`, the engine automatically vaporizes a lowest-value tile with a particle burst so gameplay and Auto-Play AI never soft-lock.
              - **Blitz & Session Clock Auto-Pause:** The timer now pauses automatically whenever the Welcome Showcase is open or the browser tab is hidden (`document.hidden`).

            ### 🚀 Core Studio Highlights
            - **10 Themes × Connected 60 FPS Live Wallpapers (20 Palettes):** Including the *Obsidian & 24K Imperial Gold* dark palette for *Classic Warm* and two-way Theme ↔ Wallpaper sync inside the AngularJS Wallpaper Studio.
            - **First-Run Translucent Welcome Showcase (`▶ Let's Start`):** Forever-once persistence in both a 2099 browser cookie and `localStorage`.
            - **Node.js Server & Offline Standalone Build:** Strict release-only CI pipeline (zero deployment jobs).

            ### 📦 Download Options
            - **`2048-standalone.html`** — Single-file offline app with CSS, AngularJS, Live Wallpaper Engine, and 2048 Engine embedded.
            - **`2048-app-${{ needs.package-app.outputs.version }}.zip` / `.tar.gz`** — Complete web & Node.js project archive.
          files: |
            release-assets/2048-app-${{ needs.package-app.outputs.version }}.zip
            release-assets/2048-app-${{ needs.package-app.outputs.version }}.tar.gz
            release-assets/2048-standalone.html
